services:
  web:
    build: .
    restart: unless-stopped
    environment:
      - FLASK_APP=app.py
    env_file:
      - .env
    expose:
      - "5000"

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web
