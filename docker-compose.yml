services:
  web:
    build: .
    restart: unless-stopped
    environment:
      - FLASK_APP=app.py
    env_file:
      - .env
    expose:
      - "5000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - weather_network

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - weather_network

networks:
  weather_network:
    driver: bridge
