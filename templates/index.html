<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Часы + Погода</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
        <!-- Защита: базовый фон, чтобы не было белого экрана если CSS не прогрузится -->
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #591e78 0%, #ac9efb 100%);
            color: white;
            min-height: 100vh;
        }
        body.night { background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3a 100%); }
    </style>

    <!-- Остальные стили (анимации облаков, дождь, неон) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Анимированный фон -->
    <div class="animated-bg" id="animated-bg">
        <div class="sun-rays"></div>
        <div class="cloud cloud-1"></div><div class="cloud cloud-2"></div><div class="cloud cloud-3"></div><div class="cloud cloud-4"></div>
        <div class="particles">
            <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
            <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
        </div>
        <div class="rain-container" id="rain-container"></div>
    </div>

    <!-- Навигация -->
    <div class="flex justify-center gap-4 pt-6 pb-4 relative z-10">
        <a href="/" class="px-6 py-2 rounded-full bg-white/20 backdrop-blur-md text-white font-semibold hover:bg-white/30 transition-colors duration-200" id="nav-home">Погода сейчас</a>
        <a href="/forecast" class="px-6 py-2 rounded-full bg-white/10 backdrop-blur-md text-white/70 font-semibold hover:bg-white/20 transition-colors duration-200" id="nav-forecast">Прогноз на неделю</a>
    </div>

    <!-- Скелетон-лоадер -->
    <div class="fixed inset-0 bg-black/20 backdrop-blur-sm z-50 flex items-center justify-center transition-opacity duration-500" id="loader">
        <div class="text-center">
            <div class="skeleton-box skeleton-title"></div>
            <div class="skeleton-box skeleton-text"></div>
            <div class="skeleton-box skeleton-icon"></div>
            <div class="flex gap-4 justify-center mt-6">
                <div class="skeleton-box w-20 h-16"></div>
                <div class="skeleton-box w-20 h-16"></div>
                <div class="skeleton-box w-20 h-16"></div>
            </div>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="max-w-2xl mx-auto px-6 pb-4 relative z-10 space-y-4" id="container">
        <!-- Часы -->
        <div id="clock-section" class="bg-white/10 backdrop-blur-lg rounded-3xl p-5 text-center text-white shadow-2xl border border-white/20">
            <div class="text-5xl md:text-6xl font-bold tracking-wider" style="font-family: 'Montserrat', sans-serif;" id="time">00:00:00</div>
            <div class="flex justify-center gap-4 mt-2 text-white/80 text-sm md:text-base">
                <span id="date">00-00-0000</span>
                <span>•</span>
                <span id="day">Понедельник</span>
            </div>
        </div>

        <!-- Погода -->
        <div id="weather-section" class="bg-white/10 backdrop-blur-lg rounded-3xl p-5 text-white shadow-2xl border border-white/20">
            <div class="text-center mb-2">
                <div class="text-2xl font-bold" style="font-family: 'Montserrat', sans-serif;" id="city">Загрузка...</div>
                <div class="text-white/70 capitalize mt-1" id="desc">—</div>
            </div>

            <div class="flex items-center justify-center gap-6 mb-4">
                <div id="weather-icon" class="text-8xl drop-shadow-lg">☀️</div>
                <div class="text-6xl md:text-7xl font-extralight" id="temp">--°C</div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div class="bg-white/5 rounded-2xl p-3 text-center border border-white/10">
                    <div class="flex justify-center mb-1 text-white/60"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg></div>
                    <div class="text-[0.65rem] text-white/50 mb-0.5">Ощущается</div>
                    <div class="text-base font-semibold" id="feels_like">--°C</div>
                </div>
                <div class="bg-white/5 rounded-2xl p-3 text-center border border-white/10">
                    <div class="flex justify-center mb-1 text-white/60"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></div>
                    <div class="text-[0.65rem] text-white/50 mb-0.5">Влажность</div>
                    <div class="text-base font-semibold" id="humidity">--%</div>
                </div>
                <div class="bg-white/5 rounded-2xl p-3 text-center border border-white/10">
                    <div class="flex justify-center mb-1 text-white/60"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
                    <div class="text-[0.65rem] text-white/50 mb-0.5">Давление</div>
                    <div class="text-base font-semibold" id="pressure">--</div>
                </div>
                <div class="bg-white/5 rounded-2xl p-3 text-center border border-white/10">
                    <div class="flex justify-center mb-1 text-white/60"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg></div>
                    <div class="text-[0.65rem] text-white/50 mb-0.5">Ветер</div>
                    <div class="text-base font-semibold" id="wind">--</div>
                </div>
                <div class="bg-white/5 rounded-2xl p-3 text-center border border-white/10">
                    <div class="flex justify-center mb-1 text-white/60"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="2" x2="12" y2="9"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><line x1="23" y1="22" x2="1" y2="22"/><polyline points="8,6 12,2 16,6"/></svg></div>
                    <div class="text-[0.65rem] text-white/50 mb-0.5">Восход</div>
                    <div class="text-base font-semibold" id="sunrise">--:--</div>
                </div>
                <div class="bg-white/5 rounded-2xl p-3 text-center border border-white/10">
                    <div class="flex justify-center mb-1 text-white/60"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="9" x2="12" y2="2"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><line x1="23" y1="22" x2="1" y2="22"/><polyline points="8,6 12,10 16,6"/></svg></div>
                    <div class="text-[0.65rem] text-white/50 mb-0.5">Закат</div>
                    <div class="text-base font-semibold" id="sunset">--:--</div>
                </div>
            </div>

            <div class="flex items-center justify-center gap-3 mt-4 text-white/50 text-sm border-t border-white/10 pt-4">
                <button class="text-white/70 hover:text-white transition-colors" id="update-btn" title="Обновить">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                </button>
                <span id="last-updated">Обновлено: --:--:--</span>
            </div>
        </div>
    </div>

    <script>
        let currentVersion = "{{ version }}";
        function checkForUpdates() { fetch('/api/version?t=' + Date.now(), { cache: 'no-store' }).then(response => response.json()).then(data => { if (data.version !== currentVersion) { window.location.href = window.location.href.split('?')[0] + '?v=' + data.version; } }).catch(err => console.warn("Ошибка проверки обновлений:", err)); }
        setInterval(checkForUpdates, 30000);
        window.addEventListener('load', () => { setTimeout(() => { document.getElementById('loader').classList.add('hidden'); }, 800); });
        function updateTime() { const now = new Date(); const days = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"]; const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"]; document.getElementById('time').textContent = now.toLocaleTimeString('ru-RU', { hour12: false }); document.getElementById('date').textContent = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`; document.getElementById('day').textContent = days[now.getDay()]; }
        function updateTheme() { const hour = new Date().getHours(); if (hour >= 20 || hour < 6) { document.body.classList.add('night'); } else { document.body.classList.remove('night'); } }

        function getWeatherEmoji(icon) {
            const map = { '01d': '☀️', '01n': '🌙', '02d': '⛅', '02n': '☁️', '03d': '☁️', '03n': '☁️', '04d': '☁️', '04n': '☁️', '09d': '🌧️', '09n': '🌧️', '10d': '🌦️', '10n': '🌧️', '11d': '⛈️', '11n': '⛈️', '13d': '❄️', '13n': '❄️', '50d': '🌫️', '50n': '🌫️' };
            return map[icon] || '🌤️';
        }

        function updateWeather() { const updateBtn = document.getElementById('update-btn'); updateBtn.classList.add('spinning'); const requestTime = new Date(); fetch('/api/weather').then(response => response.json()).then(data => { if (data.error) { console.warn("API вернул ошибку:", data.error); return; } document.getElementById('city').textContent = data.city; document.getElementById('temp').textContent = `${Math.round(data.temp)}°C`; document.getElementById('feels_like').textContent = `${Math.round(data.feels_like)}°C`; document.getElementById('humidity').textContent = `${data.humidity}%`; document.getElementById('pressure').textContent = `${data.pressure} мм рт. ст.`; document.getElementById('wind').textContent = data.wind; document.getElementById('sunrise').textContent = data.sunrise; document.getElementById('sunset').textContent = data.sunset; document.getElementById('desc').textContent = data.desc; document.getElementById('weather-icon').textContent = getWeatherEmoji(data.icon); updateRainEffect(data.weather_id); document.getElementById('last-updated').textContent = `Обновлено: ${requestTime.toLocaleTimeString('ru-RU', { hour12: false })}`; }).catch(err => { console.error("Ошибка загрузки погоды:", err); document.getElementById('city').textContent = 'Ошибка'; }).finally(() => { updateBtn.classList.remove('spinning'); }); }

        function updateRainEffect(weatherId) { const rainContainer = document.getElementById('rain-container'); const rainCodes = [200, 201, 202, 210, 211, 212, 221, 230, 231, 232, 300, 301, 302, 310, 311, 312, 313, 314, 321, 500, 501, 502, 503, 504, 511, 520, 521, 522, 531]; if (rainCodes.includes(weatherId)) { if (rainContainer.children.length === 0) { for (let i = 0; i < 50; i++) { const drop = document.createElement('div'); drop.className = 'raindrop'; drop.style.left = Math.random() * 100 + '%'; drop.style.animationDuration = (Math.random() * 1 + 0.5) + 's'; drop.style.animationDelay = Math.random() * 2 + 's'; rainContainer.appendChild(drop); } } rainContainer.classList.add('active'); } else { rainContainer.classList.remove('active'); } }

        document.getElementById('update-btn').addEventListener('click', updateWeather);
        setInterval(updateTime, 1000); setInterval(updateTheme, 60000); setInterval(updateWeather, 900000);
        updateTime(); updateTheme(); updateWeather();

        // --- Эффект прохождения облака под стеклом ---
        const glassCards = [ document.getElementById('clock-section'), document.getElementById('weather-section') ];
        const clouds = document.querySelectorAll('.cloud');
        function checkCloudIntersection() {
            glassCards.forEach(card => {
                if (!card) return;
                const cardRect = card.getBoundingClientRect();
                let isOverlapping = false;
                clouds.forEach(cloud => {
                    const cloudRect = cloud.getBoundingClientRect();
                    if (!(cloudRect.right < cardRect.left || cloudRect.left > cardRect.right || cloudRect.bottom < cardRect.top || cloudRect.top > cardRect.bottom)) { isOverlapping = true; }
                });
                if (isOverlapping) { card.classList.add('cloud-passing'); } else { card.classList.remove('cloud-passing'); }
            });
            requestAnimationFrame(checkCloudIntersection);
        }
        requestAnimationFrame(checkCloudIntersection);
    </script>
</body>
</html>
